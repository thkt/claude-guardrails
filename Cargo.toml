[package]
name = "guardrails"
version = "0.16.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tempfile = "3"
libc = "0.2"
oxc_allocator = "0.121"
oxc_parser = "0.121"
oxc_ast = "0.121"
oxc_span = "0.121"
oxc_ast_visit = "0.121"
oxc_semantic = "0.121"
oxc_syntax = "0.133"
ureq = "3"
sha2 = "0.11"
constant_time_eq = "0.5"
tar = "0.4"
flate2 = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Groups
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Pedantic opt-outs (common false positives for a hook CLI binary)
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
# `Path`/`PathBuf` have no `Display`; `{path:?}` keeps the quoted form
# that error messages rely on for readability.
unnecessary_debug_formatting = "allow"
# `.ts` / `.tsx` are treated as exact tokens both in production and tests;
# case-insensitive matching would change semantics, not just relax them.
case_sensitive_file_extension_comparisons = "allow"

# absolute paths
absolute_paths = "deny"
# idiomatic iterators
cast_possible_truncation = "deny"
redundant_closure_for_method_calls = "deny"
filter_map_next = "deny"
flat_map_option = "deny"
manual_filter_map = "deny"
manual_find_map = "deny"
# imports
wildcard_imports = "deny"
enum_glob_use = "deny"
# strings
str_to_string = "deny"
# arguments
needless_pass_by_value = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
