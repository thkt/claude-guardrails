name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install nextest
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-nextest

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

      - name: Test
        run: cargo nextest run --profile ci

      # Verify color module respects NO_COLOR (LazyLock in color.rs).
      # Full suite re-run ensures all output-formatting paths work without ANSI codes.
      - name: Test (NO_COLOR)
        run: cargo nextest run --profile ci
        env:
          NO_COLOR: "1"

  coverage:
    # Coverage delta gate: fail when project line coverage (C0) drops vs main.
    # Move-only refactors relocate already-tested lines; to a changed-lines gate
    # (diff-cover) the added side looks "new and uncovered" even though total
    # coverage is unchanged. Measuring base-vs-head total C0 is move-immune:
    # relocated lines cancel out, while genuinely new untested code still lowers
    # the total and fails. This is the literal reading of THRESHOLDS.md
    # "Coverage" (C0/C1 must not drop), so existing unreachable code is never
    # flagged (no absolute floor).
    # History: began as a diff-cover changed-lines gate ported from yomu
    # (Issue #223); switched to base-vs-head total C0 when that proxy
    # false-failed the move-only PR #232 (Issue #227 ast_security split).
    # The second cargo llvm-cov run (~+1-2 min) is the accepted cost of removing
    # the move false-positive.
    # download.rs is excluded (--ignore-filename-regex): its network-IO paths
    # (fetch_url / extract / write_atomic) are covered non-deterministically by
    # the integration tests, which spawn the real binary and download oxlint, so
    # cache/network/test-order state flips ~15 lines run-to-run (confirmed in CI
    # via debug PR #234: same-commit runs differed only in download.rs). Its
    # security-critical unit tests (validate_entry_path / verify_sha256 /
    # decode_hex) still run under `cargo test`; only the coverage % is ungated.
    # tests.rs files are excluded (--ignore-filename-regex /tests\.rs$): the gate
    # measures production-line coverage only. cargo-llvm-cov counts inline
    # `#[cfg(test)] mod tests {}` lines but not separate `mod tests; -> tests.rs`
    # files, so moving inline tests to a tests.rs file (the #227 split, ADR module
    # layout) deterministically dropped C0 by removing 100%-hit test lines from the
    # denominator (PR #237: 96.50 -> 96.38). Excluding tests.rs makes coverage
    # production-only, so test relocation is neutral and the metric is meaningful.
    # src/rules/doc_catalog/ is excluded for the same production-only reason: it
    # is a #[cfg(test)] module (README drift gates + an #[ignore]d bless generator
    # that regenerates the README rule tables). The bless generator and its
    # bootstrap path never run under llvm-cov (ignored + writes source files), so
    # they are permanently uncovered test tooling; counting them dropped C0
    # 96.25 -> 95.58 (Issue #257 / PR #261).
    # src/hook/precision/ is excluded for the same production-only reason: it is
    # a #[cfg(test)] corpus harness (Issue #255) split across non-tests.rs files,
    # so llvm-cov would count its measurement code in the C0 denominator.
    # Runs on ubuntu like the test job (guardrails has no mlx dependency,
    # so no Apple-silicon BLAS requirement).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-llvm-cov

      - name: Coverage delta gate (project C0 must not drop vs main)
        run: |
          set -euo pipefail
          # Sum LH (lines hit) / LF (lines found) across an lcov report -> C0 %.
          c0() { awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{ if (f==0) print "100.0"; else printf "%.4f", h*100/f }' "$1"; }
          # HEAD = PR merged into main (the checked-out pull_request ref).
          # cargo llvm-cov cleans stale profraw at the start of each run, so the
          # two measurements below do not mix.
          cargo llvm-cov --ignore-filename-regex 'src/download\.rs|/tests\.rs$|src/rules/doc_catalog|src/hook/precision' --lcov --output-path head.info
          head_c0=$(c0 head.info)
          # BASE = main (fetch-depth:0 already has the history).
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout --quiet --force origin/main
          cargo llvm-cov --ignore-filename-regex 'src/download\.rs|/tests\.rs$|src/rules/doc_catalog|src/hook/precision' --lcov --output-path base.info
          base_c0=$(c0 base.info)
          # 0.1pp tolerance absorbs instrumentation rounding / total line drift.
          awk -v b="$base_c0" -v h="$head_c0" 'BEGIN {
            printf "C0 coverage: main %.2f%% -> PR %.2f%%\n", b, h
            if (h + 0.1 < b) {
              printf "::error::C0 coverage dropped %.2f%% -> %.2f%% (tolerance 0.1pp)\n", b, h
              exit 1
            }
            print "OK: coverage did not drop"
          }'

  precision:
    # Precision delta gate: fail when any rule's false-positive rate on the
    # should-not-fire corpus worsens vs main (Issue #255). The metrics test
    # (src/hook/precision.rs) writes a per-rule JSON snapshot when
    # GUARDRAILS_METRICS_OUT is set; this job runs it on head and base and
    # compares per rule with integer cross-multiplication
    # (head.fp * base.clean > base.fp * head.clean, clean = fp + tn), which
    # avoids float rounding and normalizes for corpus growth. FP only: false
    # negatives are deliberately not gated, so known-FN samples can be banked
    # in the corpus first and fixed in later PRs with the improvement visible.
    # Rules absent from base metrics (new rules) are skipped; a missing
    # base.json (main predates the harness) skips the whole gate (bootstrap).
    # Plain `cargo test` (not nextest): a single named test driven by an env
    # var, run identically on both checkouts; the ci nextest profile adds
    # nothing here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Precision delta gate (per-rule FP rate must not worsen vs main)
        run: |
          set -euo pipefail
          # HEAD = PR merged into main (the checked-out pull_request ref).
          GUARDRAILS_METRICS_OUT="$PWD/head.json" cargo test --quiet hook::precision::metrics_snapshot
          if [ ! -f head.json ]; then
            echo "::error::precision harness produced no head metrics (test filter matched nothing?)"
            exit 1
          fi
          # BASE = main (fetch-depth:0 already has the history). When main
          # predates the harness, the test filter matches nothing (exit 0)
          # and no base.json is written -> bootstrap skip below. When main
          # has the harness file but still produced no JSON, the filter or
          # the env seam drifted -> fail instead of silently skipping.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout --quiet --force origin/main
          GUARDRAILS_METRICS_OUT="$PWD/base.json" cargo test --quiet hook::precision::metrics_snapshot
          if [ ! -f base.json ]; then
            if [ -f src/hook/precision.rs ]; then
              echo "::error::base has the precision harness but emitted no metrics (test filter drift?)"
              exit 1
            fi
            echo "bootstrap: main has no precision metrics yet, skipping FP delta gate"
            exit 0
          fi
          # jq must error (not read null) on any schema drift, and the gate must
          # observe that error: a bare `report=$(jq ...)` masks jq's exit status
          # under set -e, so a renamed/missing field would exit 0 and the FP gate
          # would silently disable (ADR-0019 schema contract). `// error(...)`
          # makes a missing field fatal; `if ! report=$(...)` propagates it.
          if ! report=$(jq -rn --slurpfile base base.json --slurpfile head head.json '
            ($base[0].rules // {}) as $b
            | ($head[0].rules // error("head metrics: .rules key missing (schema drift? see ADR-0019)"))
            | to_entries[]
            | .key as $rule | .value as $h | $b[$rule] as $br
            | if $br == null then
                "SKIP \($rule): absent from base metrics (new rule)"
              else
                ($h.fp // error("head rule \($rule): fp field missing")) as $hfp
                | ($h.tn // error("head rule \($rule): tn field missing")) as $htn
                | ($br.fp // error("base rule \($rule): fp field missing")) as $bfp
                | ($br.tn // error("base rule \($rule): tn field missing")) as $btn
                | if ($hfp * ($bfp + $btn)) > ($bfp * ($hfp + $htn)) then
                    "FAIL \($rule): FP rate worsened, base \($bfp)/\($bfp + $btn) -> head \($hfp)/\($hfp + $htn)"
                  else empty end
              end
          '); then
            echo "::error::precision gate jq evaluation failed (metrics JSON schema drift? base/head field mismatch — see ADR-0019 schema contract)"
            exit 1
          fi
          if [ -n "$report" ]; then printf '%s\n' "$report"; fi
          if printf '%s\n' "$report" | grep -q '^FAIL'; then
            echo "::error::per-rule FP rate worsened vs main (see FAIL lines above)"
            exit 1
          fi
          echo "OK: no per-rule FP rate regression"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-deny@0.19.6

      - name: Install cargo-audit
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-audit@0.22.1

      - name: Deny check
        run: cargo deny check

      - name: Audit
        run: cargo audit
