name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install nextest
        uses: taiki-e/install-action@6ed6112eb9893c58dd600eebccdf6e77ab7bfa9c # v2.79.12
        with:
          tool: cargo-nextest

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

      - name: Test
        run: cargo nextest run --profile ci

      # Verify color module respects NO_COLOR (LazyLock in color.rs).
      # Full suite re-run ensures all output-formatting paths work without ANSI codes.
      - name: Test (NO_COLOR)
        run: cargo nextest run --profile ci
        env:
          NO_COLOR: "1"

  coverage:
    # Coverage delta gate: fail when project line coverage (C0) drops vs main.
    # Move-only refactors relocate already-tested lines; to a changed-lines gate
    # (diff-cover) the added side looks "new and uncovered" even though total
    # coverage is unchanged. Measuring base-vs-head total C0 is move-immune:
    # relocated lines cancel out, while genuinely new untested code still lowers
    # the total and fails. This is the literal reading of THRESHOLDS.md
    # "Coverage" (C0/C1 must not drop), so existing unreachable code is never
    # flagged (no absolute floor).
    # History: began as a diff-cover changed-lines gate ported from yomu
    # (Issue #223); switched to base-vs-head total C0 when that proxy
    # false-failed the move-only PR #232 (Issue #227 ast_security split).
    # The second cargo llvm-cov run (~+1-2 min) is the accepted cost of removing
    # the move false-positive.
    # download.rs is excluded (--ignore-filename-regex): its network-IO paths
    # (fetch_url / extract / write_atomic) are covered non-deterministically by
    # the integration tests, which spawn the real binary and download oxlint, so
    # cache/network/test-order state flips ~15 lines run-to-run (confirmed in CI
    # via debug PR #234: same-commit runs differed only in download.rs). Its
    # security-critical unit tests (validate_entry_path / verify_sha256 /
    # decode_hex) still run under `cargo test`; only the coverage % is ungated.
    # tests.rs files are excluded (--ignore-filename-regex /tests\.rs$): the gate
    # measures production-line coverage only. cargo-llvm-cov counts inline
    # `#[cfg(test)] mod tests {}` lines but not separate `mod tests; -> tests.rs`
    # files, so moving inline tests to a tests.rs file (the #227 split, ADR module
    # layout) deterministically dropped C0 by removing 100%-hit test lines from the
    # denominator (PR #237: 96.50 -> 96.38). Excluding tests.rs makes coverage
    # production-only, so test relocation is neutral and the metric is meaningful.
    # src/rules/doc_catalog/ is excluded for the same production-only reason: it
    # is a #[cfg(test)] module (README drift gates + an #[ignore]d bless generator
    # that regenerates the README rule tables). The bless generator and its
    # bootstrap path never run under llvm-cov (ignored + writes source files), so
    # they are permanently uncovered test tooling; counting them dropped C0
    # 96.25 -> 95.58 (Issue #257 / PR #261).
    # Runs on ubuntu like the test job (guardrails has no mlx dependency,
    # so no Apple-silicon BLAS requirement).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6ed6112eb9893c58dd600eebccdf6e77ab7bfa9c # v2.79.12
        with:
          tool: cargo-llvm-cov

      - name: Coverage delta gate (project C0 must not drop vs main)
        run: |
          set -euo pipefail
          # Sum LH (lines hit) / LF (lines found) across an lcov report -> C0 %.
          c0() { awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{ if (f==0) print "100.0"; else printf "%.4f", h*100/f }' "$1"; }
          # HEAD = PR merged into main (the checked-out pull_request ref).
          # cargo llvm-cov cleans stale profraw at the start of each run, so the
          # two measurements below do not mix.
          cargo llvm-cov --ignore-filename-regex 'src/download\.rs|/tests\.rs$|src/rules/doc_catalog' --lcov --output-path head.info
          head_c0=$(c0 head.info)
          # BASE = main (fetch-depth:0 already has the history).
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout --quiet --force origin/main
          cargo llvm-cov --ignore-filename-regex 'src/download\.rs|/tests\.rs$|src/rules/doc_catalog' --lcov --output-path base.info
          base_c0=$(c0 base.info)
          # 0.1pp tolerance absorbs instrumentation rounding / total line drift.
          awk -v b="$base_c0" -v h="$head_c0" 'BEGIN {
            printf "C0 coverage: main %.2f%% -> PR %.2f%%\n", b, h
            if (h + 0.1 < b) {
              printf "::error::C0 coverage dropped %.2f%% -> %.2f%% (tolerance 0.1pp)\n", b, h
              exit 1
            }
            print "OK: coverage did not drop"
          }'

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@6ed6112eb9893c58dd600eebccdf6e77ab7bfa9c # v2.79.12
        with:
          tool: cargo-deny@0.19.6

      - name: Install cargo-audit
        uses: taiki-e/install-action@6ed6112eb9893c58dd600eebccdf6e77ab7bfa9c # v2.79.12
        with:
          tool: cargo-audit@0.22.1

      - name: Deny check
        run: cargo deny check

      - name: Audit
        run: cargo audit
