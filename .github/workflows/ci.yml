name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install nextest
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2.79.3
        with:
          tool: cargo-nextest

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

      - name: Test
        run: cargo nextest run --profile ci

      # Verify color module respects NO_COLOR (LazyLock in color.rs).
      # Full suite re-run ensures all output-formatting paths work without ANSI codes.
      - name: Test (NO_COLOR)
        run: cargo nextest run --profile ci
        env:
          NO_COLOR: "1"

  coverage:
    # Coverage delta gate: fail when project line coverage (C0) drops vs main.
    # Move-only refactors relocate already-tested lines; to a changed-lines gate
    # (diff-cover) the added side looks "new and uncovered" even though total
    # coverage is unchanged. Measuring base-vs-head total C0 is move-immune:
    # relocated lines cancel out, while genuinely new untested code still lowers
    # the total and fails. This is the literal reading of THRESHOLDS.md
    # "Coverage" (C0/C1 must not drop), so existing unreachable code is never
    # flagged (no absolute floor).
    # History: began as a diff-cover changed-lines gate ported from yomu
    # (Issue #223); switched to base-vs-head total C0 when that proxy
    # false-failed the move-only PR #232 (Issue #227 ast_security split).
    # The second cargo llvm-cov run (~+1-2 min) is the accepted cost of removing
    # the move false-positive.
    # Runs on ubuntu like the test job (guardrails has no mlx dependency,
    # so no Apple-silicon BLAS requirement).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2.79.3
        with:
          tool: cargo-llvm-cov

      - name: DEBUG - coverage determinism (throwaway, never merge)
        run: |
          set -uo pipefail
          c0() { awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{ if (f==0) print "100.0"; else printf "%.4f", h*100/f }' "$1"; }
          pf() { awk -F: '/^SF:/{sf=$2} /^LH:/{print sf":"$2}' "$1" | sort; }
          # Experiment A: 2x cargo llvm-cov on the SAME checkout (no git switch).
          # Non-empty diff => coverage is non-deterministic within CI; the listed
          # files are the noise source.
          cargo llvm-cov --lcov --output-path a1.info
          cargo llvm-cov --lcov --output-path a2.info
          echo "A) same-HEAD: run1=$(c0 a1.info)%  run2=$(c0 a2.info)%"
          echo "A) per-file LH diff (empty = deterministic within CI):"
          paste -d'|' <(pf a1.info) <(pf a2.info) | awk -F'|' '{split($1,x,":"); split($2,y,":"); if (x[2]!=y[2]) print "  "x[1]": "x[2]" -> "y[2]}'
          echo "A) --- end ---"
          # Experiment B: the real gate flow (head vs checkout origin/main).
          # head Rust == main Rust on this branch (only ci.yml differs), so a
          # non-empty B diff while A is empty points at the checkout-between-runs
          # job design (target/profraw carryover), not run-to-run noise.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout --quiet --force origin/main
          cargo llvm-cov --lcov --output-path base.info
          echo "B) head(a1)=$(c0 a1.info)%  base(main)=$(c0 base.info)%"
          echo "B) per-file LH diff (head a1 vs base main):"
          paste -d'|' <(pf a1.info) <(pf base.info) | awk -F'|' '{split($1,x,":"); split($2,y,":"); if (x[2]!=y[2]) print "  "x[1]": "x[2]" -> "y[2]}'
          echo "B) --- end ---"
          echo "=== DEBUG END (this step never fails; informational only) ==="

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2.79.3
        with:
          tool: cargo-deny@0.19.6

      - name: Install cargo-audit
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2.79.3
        with:
          tool: cargo-audit@0.22.1

      - name: Deny check
        run: cargo deny check

      - name: Audit
        run: cargo audit
